name: 'Testing'

on: pull_request

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
      - name: Install pylint
        run: pip install pylint
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
